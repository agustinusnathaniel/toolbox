packages:
  - apps/*
  - packages/*
onlyBuiltDependencies:
  - '@biomejs/biome'
  - sharp
ignoredBuiltDependencies:
  - esbuild

catalogMode: prefer

catalog:
  "@biomejs/biome": "2.4.10"
  "@types/node": ^24
  typescript: "^6.0.2"
  ultracite: "7.4.0"
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
