allowBuilds:
  "@tailwindcss/oxide": true
  "esbuild": true
  "sharp": true

overrides:
  "vite": 'catalog:'
  "vitest": 'catalog:'
  # Align the bundler toolchain with the TanStack Start SPA reference projects
  # (cartrack, vrts-pro-cossui). The default lockfile resolution pinned a stale
  # rolldown RC + rollup 2 that diverged from the working references.
  "rolldown": "1.2.3"
  "rollup": "4.62.2"
  "serialize-javascript@>=5.0.0 <7.0.3": ">=7.0.3"
  "dompurify@<3.4.12": ">=3.4.12"
  "brace-expansion@<5.0.9": ">=5.0.9"
  "esbuild@>=0.27.3 <0.28.1": ">=0.28.1"
  "fast-uri@>=3.0.0 <3.1.5": ">=3.1.5"
  "postcss@<=8.5.22": ">=8.5.23"
  "undici@>=7.0.0 <7.29.0": "7.29.0"
  "js-yaml@>=4.0.0 <4.3.1": ">=4.3.1"
  "nanoid@<3.3.17": ">=3.3.17 <4"
  "sharp@<0.35.0": "0.35.3"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@^0.2.9
  vitest: 4.1.11
  vite-plus: ^0.2.9
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
    # vite-plus bundles its own vitest/@vitest/browser-preview copy (currently
    # 4.1.10) while the catalog pins the standalone vitest to the latest
    # (4.1.11). The mismatch is internal to vite-plus and harmless; silence it
    # until vite-plus ships a matching vitest.
    "@vitest/browser-preview": "*"
minimumReleaseAge: 0
