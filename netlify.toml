[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Strict-Transport-Security = "max-age=31536000"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' umami.sznm.dev cdn.jsdelivr.net static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"

[[redirects]]
from = "/qrcode-generator"
to = "/qrcode"
status = 301

[[redirects]]
from = "/qrcode-generator/"
to = "/qrcode"
status = 301

[[redirects]]
from = "/js-perf-comparator"
to = "/js-perf"
status = 301

[[redirects]]
from = "/js-perf-comparator/"
to = "/js-perf"
status = 301

[[redirects]]
from = "/ev-charging-estimator"
to = "/ev-charging"
status = 301

[[redirects]]
from = "/ev-charging-estimator/"
to = "/ev-charging"
status = 301

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[build]
command = 'pnpm build'
publish = 'dist/client'

[build.environment]
NODE_VERSION = "24"
COREPACK_INTEGRITY_KEYS = "0"
